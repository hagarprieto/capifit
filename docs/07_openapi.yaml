            - type: string
            - type: 'null'
      required:
        - id
        - estado
        - programa_id
        - versao_numero
        - autor
        - enviado_em
      additionalProperties: false
    PrescricaoDetalhe:
      allOf:
        - $ref: '#/components/schemas/Prescricao'
        - type: object
          properties:
            versao:
              $ref: '#/components/schemas/Versao'
          required:
            - versao
          additionalProperties: true
      unevaluatedProperties: false
    RecusarRequest:
      type: object
      properties:
        motivo:
          type: string
          maxLength: 255
      additionalProperties: false
    Escopo:
      type: object
      properties:
        compartilha_historico:
          type: boolean
        compartilha_restricoes:
          type: boolean
      required:
        - compartilha_historico
        - compartilha_restricoes
      additionalProperties: false
    ConviteCriar:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false
    Convite:
      type: object
      properties:
        id:
