        instrucoes:
          oneOf:
            - type: string
            - type: 'null'
        observacoes_seguranca:
          oneOf:
            - type: string
            - type: 'null'
        midias:
          type: array
          items:
            $ref: '#/components/schemas/Midia'
      required:
        - id
        - nome
        - modalidade
        - unilateral
        - midias
      additionalProperties: false
    Origem:
      type: string
      enum:
