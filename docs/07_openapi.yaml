# CapiFit | Documento 07 | OpenAPI 3.1 (gerado e validado; fonte de verdade do contrato REST v1)
openapi: 3.1.0
info:
  title: CapiFit API
  version: 1.0.0
  license:
    name: Proprietária — uso interno do projeto
    identifier: LicenseRef-Proprietary
  summary: Contrato REST v1 do CapiFit
  description: >-
    Derivado dos Documentos 05 e 06. Extensões: `x-papeis` (papéis autorizados; `publico` = sem autenticação) e `x-fase`
    (fase de entrega 1–3). Toda resposta de sucesso usa o envelope `{data, meta}` (listas: `{data, pagination, meta}`).
    IDs públicos são UUID; exceção documentada: taxonomias de catálogo, mídias, sugestões, convites e consentimentos
    usam ids string opacos porque não são sincronizáveis.
servers:
  - url: https://api.exemplo.invalid/v1
    description: Placeholder — não é um serviço real
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Cadastro, login e tokens
  - name: Conta
    description: Perfil, perfil de treino e dispositivos
  - name: Privacidade
    description: Consentimentos e direitos do titular
  - name: Catalogo
    description: Exercícios, grupos e equipamentos
  - name: Programas
    description: Programas, versões, ativação e cópias
  - name: Sessoes
    description: Execução de treino e séries
  - name: Progresso
    description: Último registro e resumo de evolução
  - name: Sync
    description: Sincronização offline idempotente
  - name: Coach
    description: Vínculos, prescrição e aceite (Fase 3)
  - name: Sugestoes
    description: Motor de sugestão por regras (Fase 2)
  - name: Admin
    description: Catálogo, revisão, papéis e auditoria
paths:
  /auth/register:
    post:
      tags:
        - Auth
      operationId: authRegister
      summary: Criar conta de aluno
      x-papeis:
        - publico
      x-fase: '1'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/TokenResponse'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
