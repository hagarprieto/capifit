          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
  /admin/auditoria:
    get:
      tags:
        - Admin
      operationId: admAuditoria
      summary: Consultar trilha de auditoria
      x-papeis:
        - admin
      x-fase: '1'
      parameters:
        - name: recurso
          in: query
          schema:
            type: string
        - name: recurso_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditoriaEvento'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  meta:
                    $ref: '#/components/schemas/Meta'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token de 15 min. Papel e vínculo são reconferidos no banco em rotas protegidas.
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Cursor opaco; inválido → 400.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Mesma chave + mesmo corpo devolve a resposta original; corpo diferente → 409 IDEMPOTENCY_KEY_REUSED.
  responses:
    BadRequest:
      description: JSON inválido ou parâmetro malformado (INVALID_JSON).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthenticated:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sem papel, vínculo ou escopo adequado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Inexistente ou invisível ao ator (sem vazamento).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflito de estado, revisão ou idempotência.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Violação de regra de domínio; `details.fields`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Limite excedido; header Retry-After.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: integer
    NotImplementedYet:
      description: Planejado, ainda não disponível.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Meta:
      type: object
      properties:
        request_id:
          type: string
        schema_version:
          type: string
      additionalProperties: false
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          oneOf:
            - type: string
            - type: 'null'
      required:
        - limit
        - next_cursor
      additionalProperties: false
    ErrorCode:
      type: string
      enum:
        - INVALID_JSON
        - UNAUTHENTICATED
        - FORBIDDEN
        - RESOURCE_NOT_FOUND
        - PROGRAM_VERSION_CONFLICT
        - VERSION_IMMUTABLE
        - REVISION_CONFLICT
        - SESSION_ALREADY_OPEN
        - SESSION_CLOSED
        - IDEMPOTENCY_KEY_REUSED
        - PRESCRIPTION_NOT_PENDING
        - COACH_NOT_VERIFIED
        - CONSENT_REQUIRED
        - UNDERAGE_NOT_ALLOWED
        - VALIDATION_ERROR
        - RATE_LIMITED
        - NOT_IMPLEMENTED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
            details:
              type: object
              additionalProperties: true
              description: 'Em 422: `fields` mapeia campo → lista de mensagens.'
            request_id:
              type: string
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        nome:
          type: string
          minLength: 1
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 190
        senha:
          type: string
          minLength: 10
          maxLength: 200
        aceita_termos:
          const: true
        versao_termos:
          type: string
        versao_privacidade:
          type: string
        maior_de_18:
          const: true
        dispositivo_uuid:
          type: string
          format: uuid
      required:
        - nome
        - email
        - senha
        - aceita_termos
        - versao_termos
        - versao_privacidade
        - maior_de_18
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        senha:
          type: string
        dispositivo_uuid:
          type: string
          format: uuid
      required:
        - email
        - senha
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
        dispositivo_uuid:
          type: string
          format: uuid
      required:
        - refresh_token
      additionalProperties: false
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          minimum: 1
        refresh_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        usuario:
          $ref: '#/components/schemas/UsuarioResumo'
      required:
        - access_token
        - expires_in
        - refresh_token
        - token_type
        - usuario
      additionalProperties: false
    ForgotRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email
      additionalProperties: false
    ResetRequest:
      type: object
      properties:
        token:
          type: string
        nova_senha:
          type: string
          minLength: 10
          maxLength: 200
      required:
        - token
        - nova_senha
      additionalProperties: false
    VerifyEmailRequest:
      type: object
      properties:
        token:
          type: string
      required:
        - token
      additionalProperties: false
    Papel:
      type: string
      enum:
        - aluno
        - coach
        - admin
    UsuarioResumo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        papeis:
          type: array
          items:
            $ref: '#/components/schemas/Papel'
      required:
        - id
        - nome
        - papeis
      additionalProperties: false
    Usuario:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
          format: email
        papeis:
          type: array
          items:
            $ref: '#/components/schemas/Papel'
        fuso_horario:
          type: string
          description: Identificador IANA
        unidade_peso:
          type: string
          enum:
            - kg
            - lb
        idioma:
          type: string
        email_verificado:
          type: boolean
      required:
        - id
        - nome
        - email
        - papeis
      additionalProperties: false
    UsuarioPatch:
      type: object
      properties:
        nome:
          type: string
        fuso_horario:
          type: string
        unidade_peso:
          type: string
          enum:
            - kg
            - lb
        idioma:
          type: string
      additionalProperties: false
      minProperties: 1
    PerfilTreinamento:
      type: object
      properties:
        nivel:
          oneOf:
            - type: string
              enum:
                - iniciante
                - intermediario
                - avancado
            - type: 'null'
        objetivo:
          oneOf:
            - type: string
              enum:
                - hipertrofia
                - forca
                - condicionamento
                - outro
            - type: 'null'
        dias_semana:
          oneOf:
            - type: integer
              minimum: 1
              maximum: 7
            - type: 'null'
        minutos_sessao:
          oneOf:
            - type: integer
              minimum: 10
              maximum: 300
            - type: 'null'
        preferencias:
          type:
            - object
            - 'null'
          additionalProperties: true
        restricoes:
          type:
            - object
            - 'null'
          additionalProperties: true
          description: Dado sensível; nunca em logs. Visível ao coach só com escopo `compartilha_restricoes`.
      additionalProperties: false
    Dispositivo:
      type: object
      properties:
        dispositivo_uuid:
          type: string
          format: uuid
        ultima_sync_em:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
        revogado_em:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
      required:
        - dispositivo_uuid
      additionalProperties: false
    DispositivoRequest:
      type: object
      properties:
        dispositivo_uuid:
          type: string
          format: uuid
      required:
        - dispositivo_uuid
      additionalProperties: false
    TipoConsentimento:
      type: string
      enum:
        - termos_uso
        - politica_privacidade
        - dados_saude
        - compartilhamento_coach
    Consentimento:
