# CapiFit | CI inicial (marco M0, história E00-05). Ainda NÃO executado no GitHub: validar no primeiro push.
name: ci

# Trabalho solo: roda em todo push (qualquer branch) e sob demanda. Se houver PRs de outras pessoas, acrescente pull_request.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contrato-e-design:
    name: Contrato OpenAPI e contraste dos tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar OpenAPI (L0)
        working-directory: tools/contract
        run: |
          npm install --no-audit --no-fund
          npm run validate
      - name: Verificar contraste dos tokens
        run: node tools/design/check-contrast.js
      - name: Varredura de segredos
        run: node tools/security/scan-secrets.js

  banco-mysql8:
    name: Schema em MySQL 8 (migrations 04, 06, 09 e seed)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar e conferir o schema
        shell: pwsh
        env:
          MYSQL_PWD: ci_only_password
        run: ./tools/db/apply-schema.ps1 -Port 3306 -WithSeed -Recreate

  api-php:
    name: API PHP (PHPUnit e PHPStan com MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci_only_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, mbstring
          tools: composer
      - name: Aplicar o schema e criar o usuário da aplicação (somente DML)
        shell: pwsh
        env:
          MYSQL_PWD: ci_only_password
          APP_DB_PASSWORD: ci_only_app_password
        run: ./tools/db/apply-schema.ps1 -Port 3306 -WithSeed -Recreate -AppUser capifit_app -AppHost '%'
      - name: Instalar dependências
        working-directory: backend
        run: composer install --no-interaction --prefer-dist
      - name: PHPStan
        working-directory: backend
        run: composer analyse
      - name: PHPUnit (unitários e integração)
        working-directory: backend
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: capifit
          DB_USER: root
          DB_PASSWORD: ci_only_password
          DB_APP_USER: capifit_app
          DB_APP_PASSWORD: ci_only_app_password
          CAPIFIT_ALLOW_DB_TESTS: '1'
        run: composer test

  app-mobile:
    name: App Expo (tokens, tipos, lint, regras e testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Tokens, TypeScript, lint, regras do projeto e testes
        run: npm run check
